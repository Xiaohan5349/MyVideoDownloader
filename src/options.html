<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="brandName">DS Video Downloader</title>
    <link rel="stylesheet" href="popup.css">
    <style>
      body { min-height: 100vh; background: repeating-linear-gradient(-45deg, rgba(255, 255, 255, 0.018) 0 10px, transparent 10px 20px), var(--bg); }
      .options-page { max-width: 560px; margin: 0 auto; padding: 32px 16px 40px; }
      .options-head {
        position: relative; display: flex; align-items: center; gap: 14px; padding: 18px 20px 24px;
        background: var(--yellow); color: var(--ink);
        clip-path: polygon(0 0, 100% 0, 100% calc(100% - 18px), calc(100% - 40px) 100%, 0 100%);
      }
      .options-head::after {
        content: ""; position: absolute; top: 0; right: 0; bottom: 0; width: 40%;
        background: repeating-linear-gradient(-45deg, rgba(0, 0, 0, 0.12) 0 7px, transparent 7px 14px); pointer-events: none;
      }
      .options-head h1 { font-size: clamp(22px, 6vw, 32px); white-space: normal; line-height: 0.95; }
      .options-card { margin-top: 18px; }
      .options-card .setting-row { margin: 0; }
      .options-saved {
        min-height: 20px; margin-top: 10px; color: var(--yellow);
        font: var(--display-style) 800 12.5px var(--display); letter-spacing: 0.08em; text-transform: uppercase;
        opacity: 0; transform: translateY(-4px); transition: opacity 200ms, transform 260ms var(--spring);
      }
      .options-saved.visible { opacity: 1; transform: none; }
      .options-footer { display: flex; gap: 14px; align-items: center; margin-top: 28px; color: var(--muted); font: 11px var(--mono); }
      .options-footer a { color: var(--yellow); text-decoration: none; font: var(--display-style) 800 13px var(--display); letter-spacing: 0.06em; text-transform: uppercase; }
      .options-footer a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <main class="options-page">
      <header class="options-head">
        <div class="brand-mark" aria-hidden="true"><i></i></div>
        <h1 data-i18n="settingsHeading">DS Video Downloader Settings</h1>
      </header>

      <section class="options-card">
        <label class="setting-row">
          <span class="setting-label" data-i18n="settingsLanguageLabel">Language</span>
          <select id="langSelector" class="lang-select">
            <option value="en" data-i18n="settingsLanguageEn">English</option>
            <option value="zh_CN" data-i18n="settingsLanguageZh">简体中文</option>
          </select>
        </label>
        <div id="savedMsg" class="options-saved" role="status"></div>
      </section>

      <footer class="options-footer">
        <span>DS Video Downloader v1.6.9</span>
        <a href="https://github.com/Xiaohan5349/MyVideoDownloader" target="_blank" rel="noopener">GitHub</a>
      </footer>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
