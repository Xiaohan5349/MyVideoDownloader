<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="brandName">DS Video Downloader</title>
    <link rel="stylesheet" href="popup.css">
    <style>
      body { min-height: 100vh; }
      .options-page { max-width: 560px; margin: 0 auto; padding: 32px 16px 40px; }
      .options-head { display: flex; align-items: center; gap: 14px; margin-bottom: 10px; }
      .options-head .brand-mark { width: 44px; height: 44px; border-radius: 13px; }
      .options-head .brand-mark .icon { width: 22px; height: 22px; }
      .options-head h1 { font-size: 22px; white-space: normal; line-height: 1.2; }
      .options-card { display: grid; gap: 8px; }
      .options-saved {
        min-height: 20px; margin-top: 2px; color: var(--teal); font: 12px var(--mono);
        opacity: 0; transform: translateY(-4px); transition: opacity 200ms, transform 200ms ease-out;
      }
      .options-saved.visible { opacity: 1; transform: none; }
      .options-footer { display: flex; gap: 14px; align-items: center; margin-top: 22px; color: var(--tx-3); font: 11.5px var(--mono); }
      .options-footer a { color: var(--blue); font-weight: 600; text-decoration: none; }
      .options-footer a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <svg width="0" height="0" class="icon-sprite" aria-hidden="true">
      <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></symbol>
    </svg>
    <main class="options-page">
      <header class="options-head">
        <span class="brand-mark" aria-hidden="true"><svg class="icon"><use href="#i-down"/></svg></span>
        <h1 data-i18n="settingsHeading">DS Video Downloader Settings</h1>
      </header>

      <section class="options-card">
        <label class="setting-row tile">
          <span class="setting-label" data-i18n="settingsLanguageLabel">Language</span>
          <select id="langSelector" class="lang-select">
            <option value="en" data-i18n="settingsLanguageEn">English</option>
            <option value="zh_CN" data-i18n="settingsLanguageZh">简体中文</option>
          </select>
        </label>
        <div id="savedMsg" class="options-saved" role="status"></div>
      </section>

      <footer class="options-footer">
        <span>DS Video Downloader v1.10.0</span>
        <a href="https://github.com/Xiaohan5349/MyVideoDownloader" target="_blank" rel="noopener">GitHub</a>
      </footer>
    </main>
    <script type="module" src="options.js"></script>
    <script src="spotlight.js"></script>
  </body>
</html>
