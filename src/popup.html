<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="brandName">DS Video Downloader</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body class="is-popup">
    <svg width="0" height="0" class="icon-sprite" aria-hidden="true">
      <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24"><path d="M6 11h12v9H6zM9 11V8a3 3 0 0 1 6 0v3"/></symbol>
      <symbol id="i-prev" viewBox="0 0 24 24"><path d="M14.5 6.5 9 12l5.5 5.5"/></symbol>
      <symbol id="i-next" viewBox="0 0 24 24"><path d="M9.5 6.5 15 12l-5.5 5.5"/></symbol>
    </svg>
    <main class="popup">
      <header class="topbar">
        <span class="brand-mark" aria-hidden="true"><svg class="icon"><use href="#i-down"/></svg></span>
        <h1 data-i18n="brandName">DS Video Downloader</h1>
        <div id="helperSummary" class="helper-summary" data-i18n="statusCheckingHelper">Checking helper...</div>
        <button id="rescanButton" class="ghost-button" type="button" data-i18n-title="btnRescanTitle">
          <svg class="icon"><use href="#i-refresh"/></svg><span data-i18n="btnRescan">Rescan</span>
        </button>
      </header>

      <nav class="tabs" data-i18n-aria="tabsMedia">
        <button class="tab-button is-active" type="button" data-panel="mediaPanel"><span data-i18n="tabsMedia">Media</span><em id="mediaTabCount" class="tab-count" hidden></em></button>
        <button class="tab-button" type="button" data-panel="helperPanel"><span data-i18n="tabsHelper">Helper</span><em id="helperTabCount" class="tab-count" hidden></em></button>
        <button class="tab-button" type="button" data-panel="settingsPanel"><span data-i18n="tabsSettings">Settings</span></button>
      </nav>

      <section id="notice" class="notice tile" role="status" hidden></section>

      <section id="mediaPanel" class="panel bento">
        <div class="tile count-tile">
          <b id="mediaCountNum" class="big-num" aria-hidden="true">0</b>
          <span id="scanLabel" class="tile-text" aria-hidden="true" data-i18n="labelDetected">detected</span>
          <span id="mediaCount" class="visually-hidden">0 detected</span>
        </div>
        <div class="tile filter-tile">
          <span id="filterSummary" class="tile-text"></span>
        </div>
        <section id="mediaList" class="media-list" aria-live="polite"></section>
      </section>

      <section id="helperPanel" class="panel bento" hidden>
        <div id="runTile" class="tile run-tile" hidden>
          <span id="runTitle" class="tile-cap"></span>
          <div class="run-row">
            <b id="runValue" class="big-num"></b>
            <div id="runNav" class="run-nav" hidden>
              <button id="runPrev" class="run-step" type="button" data-i18n-aria="btnPrevJob"><svg class="icon"><use href="#i-prev"/></svg></button>
              <span id="runPos" class="run-pos"></span>
              <button id="runNext" class="run-step" type="button" data-i18n-aria="btnNextJob"><svg class="icon"><use href="#i-next"/></svg></button>
            </div>
          </div>
          <div class="progress-bar" aria-hidden="true"><i></i></div>
          <div id="runDots" class="run-dots" aria-hidden="true" hidden></div>
        </div>
        <div id="helperStatus" class="helper-status tile"></div>
        <section class="tile jobs-tile">
          <div class="toolbar">
            <span class="section-title" data-i18n="tabsHelper">Helper jobs</span>
            <button id="openDashboardButton" class="small-button" type="button" data-i18n="btnOpenDashboard">Dashboard</button>
            <button id="refreshHelperButton" class="small-button" type="button" data-i18n="btnRefresh">Refresh</button>
            <button id="clearMissingButton" class="small-button" type="button" data-i18n="btnClearMissing">Clear missing</button>
          </div>
          <section id="helperJobs" class="job-list" aria-live="polite"></section>
        </section>
      </section>

      <section id="settingsPanel" class="panel bento" hidden>
        <label class="setting-row tile half">
          <span class="setting-label" data-i18n="settingsFilterLabel">Ignore direct media smaller than</span>
          <select id="minSizeSelect">
            <option value="0" data-i18n="settingsNoFilter">Do not filter</option>
            <option value="102400">100 KB</option>
            <option value="1048576">1 MB</option>
            <option value="5242880">5 MB</option>
            <option value="10485760">10 MB</option>
          </select>
        </label>
        <label class="check-row tile half">
          <span class="setting-label" data-i18n="settingsShowUnsupported">Show unsupported or protected media</span>
          <input id="showUnsupportedInput" class="switch" type="checkbox">
        </label>
        <div class="setting-row tile">
          <label class="setting-label" for="downloadDirInput" data-i18n="settingsDownloadDirLabel">Helper download directory</label>
          <input id="downloadDirInput" type="text" data-i18n-placeholder="settingsDownloadDirPlaceholder" placeholder="C:\Users\you\Videos">
          <div class="setting-actions">
            <button id="pickDownloadDirButton" class="ghost-button" type="button" data-i18n="btnSelectFolder">Select folder</button>
            <button id="saveDownloadDirButton" class="ghost-button is-primary" type="button" data-i18n="btnSaveHelperFolder">Save helper folder</button>
          </div>
        </div>
        <label class="setting-row tile half">
          <span class="setting-label" data-i18n="settingsLanguageLabel">Language</span>
          <select id="langSelector" class="lang-select">
            <option value="en" data-i18n="settingsLanguageEn">English</option>
            <option value="zh_CN" data-i18n="settingsLanguageZh">简体中文</option>
          </select>
        </label>
        <p class="settings-note tile half" data-i18n="settingsNote">The size filter only applies when the browser reports a direct file size. HLS/DASH playlists stay visible.</p>
      </section>

      <template id="mediaItemTemplate">
        <article class="media-item tile">
          <div class="media-kind"></div>
          <div class="media-main">
            <div class="media-title-row">
              <div class="media-title"></div>
            </div>
            <div class="media-meta-row"></div>
            <div class="variant-list" hidden></div>
            <div class="job-status" hidden></div>
          </div>
          <div class="media-go" aria-hidden="true">
            <svg class="icon icon-download"><use href="#i-down"/></svg>
            <svg class="icon icon-locked"><use href="#i-lock"/></svg>
          </div>
          <button class="download-button" type="button" data-i18n="btnDownload">Download</button>
        </article>
      </template>

      <template id="helperJobTemplate">
        <article class="helper-job">
          <div class="helper-job-title-row">
            <div class="helper-job-state"></div>
            <div class="helper-job-title"></div>
          </div>
          <div class="progress-bar" aria-hidden="true"><i></i></div>
          <div class="helper-job-meta"></div>
          <div class="helper-job-path"></div>
          <div class="helper-job-actions">
            <button class="source-button" type="button" data-i18n="btnSource">Source</button>
            <button class="resume-button" type="button" data-i18n="btnResume">Resume</button>
            <button class="browser-button" type="button" data-i18n="btnBrowserShort">Browser</button>
            <button class="cancel-button" type="button" data-i18n="btnStop">Stop</button>
            <button class="show-button" type="button" data-i18n="btnFolder">Open folder</button>
            <button class="remove-button" type="button" data-i18n="btnRemove">Remove</button>
          </div>
        </article>
      </template>
    </main>
    <script type="module" src="popup.js"></script>
    <script src="spotlight.js"></script>
  </body>
</html>
